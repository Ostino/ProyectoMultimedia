server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: any path falls back to index.html so React Router handles it
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived cache for hashed static assets (JS, CSS)
    location ~* \.(js|css|woff2?|ico|svg|png|jpg|jpeg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
