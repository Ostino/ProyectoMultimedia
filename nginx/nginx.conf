events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;

    client_max_body_size 200m;

    # Docker internal DNS — resolves service names at request time.
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream auth_backend {
        server auth-service:8081;
    }

    upstream app_backend {
        server app-service:8080;
    }

    # ── auth.mi-domain.com  →  auth-service ──────────────────────────────────
    server {
        listen 80;
        server_name auth.mi-domain.com;

        # ── TLS dev (self-signed) ─────────────────────────────────────────────
        # openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
        #   -subj "/CN=auth.mi-domain.com" \
        #   -keyout nginx/certs/auth.key -out nginx/certs/auth.crt
        # listen 443 ssl;
        # ssl_certificate     /etc/nginx/certs/auth.crt;
        # ssl_certificate_key /etc/nginx/certs/auth.key;
        # ssl_protocols       TLSv1.2 TLSv1.3;
        # ssl_ciphers         HIGH:!aNULL:!MD5;
        # ── TLS prod (certbot) ────────────────────────────────────────────────
        # certbot --nginx -d auth.mi-domain.com
        # ─────────────────────────────────────────────────────────────────────

        location / {
            proxy_pass         http://auth_backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }
    }

    # ── back.mi-domain.com  →  app-service ───────────────────────────────────
    server {
        listen 80;
        server_name back.mi-domain.com;

        client_max_body_size 500m;

        # ── TLS dev ───────────────────────────────────────────────────────────
        # openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
        #   -subj "/CN=back.mi-domain.com" \
        #   -keyout nginx/certs/back.key -out nginx/certs/back.crt
        # listen 443 ssl;
        # ssl_certificate     /etc/nginx/certs/back.crt;
        # ssl_certificate_key /etc/nginx/certs/back.key;
        # ssl_protocols       TLSv1.2 TLSv1.3;
        # ssl_ciphers         HIGH:!aNULL:!MD5;
        # ── TLS prod (certbot) ────────────────────────────────────────────────
        # certbot --nginx -d back.mi-domain.com
        # ─────────────────────────────────────────────────────────────────────

        location / {
            proxy_pass              http://app_backend;
            proxy_http_version      1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_request_buffering off;
            proxy_read_timeout      300s;
            proxy_send_timeout      300s;
        }
    }

    # ── mi-domain.com  →  React SPA + path-based API routing ─────────────────
    # The web frontend calls /auth/* and /api/* with relative URLs.
    # nginx routes them to the correct backend service.
    server {
        listen 80;
        server_name mi-domain.com www.mi-domain.com;

        # ── TLS dev ───────────────────────────────────────────────────────────
        # openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
        #   -subj "/CN=mi-domain.com" \
        #   -keyout nginx/certs/web.key -out nginx/certs/web.crt
        # listen 443 ssl;
        # ssl_certificate     /etc/nginx/certs/web.crt;
        # ssl_certificate_key /etc/nginx/certs/web.key;
        # ssl_protocols       TLSv1.2 TLSv1.3;
        # ssl_ciphers         HIGH:!aNULL:!MD5;
        # ── TLS prod (certbot) ────────────────────────────────────────────────
        # certbot --nginx -d mi-domain.com -d www.mi-domain.com
        # ─────────────────────────────────────────────────────────────────────

        # Auth service: preserves /auth/ prefix (controller maps @RequestMapping("/auth"))
        location /auth/ {
            proxy_pass         http://auth_backend/auth/;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # App service: strips /api/ prefix (controller maps @RequestMapping("/files"), etc.)
        location /api/ {
            client_max_body_size 500m;
            proxy_pass              http://app_backend/;
            proxy_http_version      1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_request_buffering off;
            proxy_read_timeout      300s;
            proxy_send_timeout      300s;
        }

        # React SPA — DNS variable allows nginx to start even without 'web' service.
        location / {
            set $web web:3000;
            proxy_pass          http://$web;
            proxy_http_version  1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache_bypass $http_upgrade;
            proxy_connect_timeout 5s;
        }
    }
}
