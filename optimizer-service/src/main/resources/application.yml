server:
  port: 8082

spring:
  application:
    name: optimizer-service
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

storage:
  base-path: ${STORAGE_PATH:/data}

# Etiquetado automático con Google Gemini. La key se lee SOLO de la variable
# de entorno GEMINI_API_KEY; si está vacía, los archivos se procesan sin etiquetas de IA.
gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-3.8-flash}
  timeout: 20s
  max-tags: 5

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

---
spring:
  config:
    activate:
      on-profile: docker
  rabbitmq:
    host: rabbitmq
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
